[package]
name = "ohaconf"
version = "0.1.0"
edition = "2024"
description = "YAML-driven CLI wrapper for oha load testing tool"
license = "MIT"

[[bin]]
name = "ohaconf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "1"
shellexpand = "3"
dialoguer = "0.11"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
which = "6"
